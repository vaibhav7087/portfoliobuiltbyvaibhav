name: nightly-project-sync

on:
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-project-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build project data from config + GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained PAT with contents:read on private repos (e.g. cureslot).
          # Falls back to GITHUB_TOKEN (public repos only) when unset.
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          npm install
          node scripts/build-projects.mjs --sync

      - name: Commit updated snapshot
        run: |
          git config user.name "nightly-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          # Retry loop: regenerating + rebasing survives concurrent pushes
          # (e.g. a deploy commit landing mid-run) instead of failing.
          n=0
          until [ $n -ge 3 ]; do
            n=$((n+1))
            node scripts/build-projects.mjs --sync
            git add src/data/projects.json src/data/project-readmes.json
            git diff --cached --quiet || git commit -m "chore(data): nightly project sync $(date -u +%F)"
            if git pull --rebase origin main; then
              if git push; then
                echo "Sync pushed."
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            sleep 10
          done
          echo "Failed to push sync after 3 attempts."
          exit 1
