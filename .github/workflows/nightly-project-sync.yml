name: nightly-project-sync

on:
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-project-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build project data from config + GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install
          node scripts/build-projects.mjs --sync

      - name: Commit updated snapshot
        run: |
          git config user.name "nightly-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/projects.json src/data/project-readmes.json
          if git diff --cached --quiet; then
            echo "No changes since last sync."
          else
            git commit -m "chore(data): nightly project sync $(date -u +%F)"
            git push
          fi
